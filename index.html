<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entraînement de Conjugaison Française</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-quiz { max-width: 600px; margin: 40px auto; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .badge-tense { font-size: 0.9rem; background-color: #0d6efd; }
        .feedback { font-size: 1.2rem; font-weight: bold; min-height: 30px; }
        .correct { color: #198754; }
        .incorrect { color: #dc3545; }
        .accent-btn { margin: 2px; padding: 4px 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="text-center mb-4">
        <h1 class="fw-bold">🇫🇷 Pratique de Conjugaison</h1>
        <p class="text-muted">Réviser et maîtriser les verbes français</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Controls / Settings -->
            <div class="card mb-4 p-3 shadow-sm">
                <div class="row g-3 align-items-center">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Temps (Tense):</label>
                        <select id="tenseSelect" class="form-select" onchange="nextQuestion()">
                            <option value="ALL">Tous les temps (All)</option>
                            <option value="Présent">Présent</option>
                            <option value="Passé Composé">Passé Composé</option>
                            <option value="Imparfait">Imparfait</option>
                            <option value="Futur Simple">Futur Simple</option>
                        </select>
                    </div>
                    <div class="col-md-6 text-end">
                        <span class="badge bg-success p-2 fs-6">Score: <span id="score">0</span></span>
                        <span class="badge bg-secondary p-2 fs-6">Série: <span id="streak">0</span> 🔥</span>
                    </div>
                </div>
            </div>

            <!-- Quiz Card -->
            <div class="card card-quiz p-4 text-center">
                <div class="mb-3">
                    <span id="verbGroup" class="badge bg-info text-dark mb-2"></span>
                    <h2 id="verbDisplay" class="display-5 fw-bold text-primary">---</h2>
                    <p class="text-muted fs-5">Temps: <strong id="tenseDisplay">---</strong></p>
                </div>

                <div class="my-3">
                    <h3 class="display-6"><span id="pronounDisplay" class="text-secondary">---</span> <span id="targetPlaceholder">_______</span></h3>
                </div>

                <!-- Accent Buttons for easy typing -->
                <div class="mb-3">
                    <small class="text-muted d-block mb-1">Caractères spéciaux :</small>
                    <button class="btn btn-outline-secondary btn-sm accent-btn" onclick="addChar('é')">é</button>
                    <button class="btn btn-outline-secondary btn-sm accent-btn" onclick="addChar('è')">è</button>
                    <button class="btn btn-outline-secondary btn-sm accent-btn" onclick="addChar('ê')">ê</button>
                    <button class="btn btn-outline-secondary btn-sm accent-btn" onclick="addChar('à')">à</button>
                    <button class="btn btn-outline-secondary btn-sm accent-btn" onclick="addChar('ù')">ù</button>
                    <button class="btn btn-outline-secondary btn-sm accent-btn" onclick="addChar('ç')">ç</button>
                    <button class="btn btn-outline-secondary btn-sm accent-btn" onclick="addChar('î')">î</button>
                </div>

                <!-- Input Form -->
                <form id="quizForm" onsubmit="checkAnswer(event)">
                    <div class="input-group mb-3 input-group-lg">
                        <input type="text" id="answerInput" class="form-control text-center" placeholder="Tapez la réponse..." autocomplete="off">
                        <button class="btn btn-primary px-4" type="submit">Valider</button>
                    </div>
                </form>

                <div id="feedback" class="feedback my-2"></div>

                <button id="nextBtn" class="btn btn-outline-primary mt-2 d-none" onclick="nextQuestion()">Question Suivante ➔</button>
            </div>
        </div>
    </div>
</div>

<script>
let verbsData = [];
let currentQuestion = null;
let score = 0;
let streak = 0;

// Load JSON data
fetch('verbs.json')
    .then(response => response.json())
    .then(data => {
        verbsData = data;
        nextQuestion();
    })
    .catch(error => {
        document.getElementById('verbDisplay').innerText = "Erreur de chargement";
        console.error('Error loading verbs:', error);
    });

function getRandomElement(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function nextQuestion() {
    if (verbsData.length === 0) return;

    document.getElementById('feedback').innerText = '';
    document.getElementById('answerInput').value = '';
    document.getElementById('answerInput').disabled = false;
    document.getElementById('nextBtn').classList.add('d-none');
    document.getElementById('answerInput').focus();

    const verbObj = getRandomElement(verbsData);
    const selectedTense = document.getElementById('tenseSelect').value;

    let tense = selectedTense;
    if (selectedTense === 'ALL') {
        const availableTenses = Object.keys(verbObj.conjugations);
        tense = getRandomElement(availableTenses);
    }

    const pronouns = Object.keys(verbObj.conjugations[tense]);
    const pronoun = getRandomElement(pronouns);
    const answer = verbObj.conjugations[tense][pronoun];

    currentQuestion = {
        verb: verbObj.verb,
        category: verbObj.category,
        tense: tense,
        pronoun: pronoun,
        answer: answer
    };

    document.getElementById('verbDisplay').innerText = currentQuestion.verb;
    document.getElementById('verbGroup').innerText = currentQuestion.category;
    document.getElementById('tenseDisplay').innerText = currentQuestion.tense;
    document.getElementById('pronounDisplay').innerText = currentQuestion.pronoun;
}

function addChar(char) {
    const input = document.getElementById('answerInput');
    input.value += char;
    input.focus();
}

function cleanString(str) {
    return str.trim().toLowerCase().replace(/\s+/g, ' ');
}

function checkAnswer(e) {
    e.preventDefault();
    const userInput = cleanString(document.getElementById('answerInput').value);
    const correctAnswer = cleanString(currentQuestion.answer);

    const feedbackEl = document.getElementById('feedback');
    document.getElementById('answerInput').disabled = true;

    if (userInput === correctAnswer) {
        score += 10;
        streak += 1;
        feedbackEl.className = 'feedback correct';
        feedbackEl.innerText = '✨ Bravo ! Correct !';
    } else {
        streak = 0;
        feedbackEl.className = 'feedback incorrect';
        feedbackEl.innerHTML = `❌ Dommage ! La réponse était : <strong>${currentQuestion.answer}</strong>`;
    }

    document.getElementById('score').innerText = score;
    document.getElementById('streak').innerText = streak;
    document.getElementById('nextBtn').classList.remove('d-none');
}
</script>

</body>
</html>
